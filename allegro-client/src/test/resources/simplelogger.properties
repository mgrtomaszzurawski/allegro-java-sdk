# Exercise the SDK's named debug channels during tests (guarded logging
# branches must run, not dead-end on a NOP logger). Default stays WARN so
# test output remains readable.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.io.github.mgrtomaszzurawski.allegro.request=debug
org.slf4j.simpleLogger.log.io.github.mgrtomaszzurawski.allegro.auth=debug
org.slf4j.simpleLogger.log.io.github.mgrtomaszzurawski.allegro.retry=debug
